services:
  # 1. POSTGRESQL DATABASE (Creates the 3 DBs automatically using init.sql)
  postgres-db:
    image: postgres:16-alpine
    container_name: myfitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MyFitness_Db_2026_Secure#}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. CONFIG SERVER
  config-server:
    build: ./config-server
    container_name: myfitness-config
    ports:
      - "8888:8888"

  # 3. API GATEWAY
  api-gateway:
    build: ./api-gateway
    container_name: myfitness-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-V_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBI}
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      config-server:
        condition: service_started
      redis:
        condition: service_started

  # 4. AUTH SERVICE
  auth-service:
    build: ./auth-service
    container_name: myfitness-auth
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/myfitness_auth
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-MyFitness_Db_2026_Secure#}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-V_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBI}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-224354018487-ud6fusgsg312ksujl9uc9nmcu1ct5ds0.apps.googleusercontent.com}
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 5. CATALOG SERVICE
  catalog-service:
    build: ./catalog-service
    container_name: myfitness-catalog
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/myfitness_catalog
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-MyFitness_Db_2026_Secure#}
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 6. WORKOUT SERVICE
  workout-service:
    build: ./workout-service
    container_name: myfitness-workout
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/myfitness_workout
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-MyFitness_Db_2026_Secure#}
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-db:
        condition: service_healthy
      config-server:
        condition: service_started

  # 7. REDIS FOR RATE-LIMITING
  redis:
    image: redis:7-alpine
    container_name: myfitness-redis
    ports:
      - "6379:6379"

  # 8. ZIPKIN FOR DISTRIBUTED TRACING
  zipkin:
    image: openzipkin/zipkin
    container_name: myfitness-zipkin
    ports:
      - "9411:9411"
  
  # 9. ELASTICSEARCH (logs DB)
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: myfitness-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  # 10. LOGSTASH (logs collector and processor)
  logstash:
    image: logstash:8.15.0
    container_name: myfitness-logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch

  # 11. KIBANA (graphic interface)
  kibana:
    image: kibana:8.15.0
    container_name: myfitness-kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  postgres_data: