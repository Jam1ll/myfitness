apiVersion: v1
kind: Service
metadata:
  name: workout-service
spec:
  selector:
    app: workout-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-service
  template:
    metadata:
      labels:
        app: workout-service
    spec:
      containers:
        - name: workout-service
          image: jamilguzman/myfitness-workout:v1
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CLOUD_CONFIG_LABEL
              value: "main"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-db:5432/myfitness_workout"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "MyFitness_Db_2026_Secure#"
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 10