apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: jamilguzman/myfitness-auth:v1
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-db:5432/myfitness_auth"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "MyFitness_Db_2026_Secure#"
            - name: JWT_SECRET_KEY
              value: "V_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBIV_[L9Ocy>bIZfbBI}"
            - name: GOOGLE_CLIENT_ID
              value: "224354018487-ud6fusgsg312ksujl9uc9nmcu1ct5ds0.apps.googleusercontent.com"
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10