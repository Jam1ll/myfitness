server:
  port: 8761 # standard Eureka port

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    # by default, Eureka tries to register itself as another microservice
    # as this is the main server, we need to make registering and fetching false for itself
    register-with-eureka: false
    fetch-registry: false