server:
  port: 8080

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      fail-fast: true
      retry:
        enabled: true
        max-attempts: 15
        initial-interval: 1000
        max-interval: 10000
        multiplier: 1.5